name: Refresh Slate knowledge mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
      timezone: 'America/New_York'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: slate-kb-pages
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install crawler dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Crawl sources and rebuild mirror
        run: python crawler/crawl.py --sources sources.txt --config config.json --output mirror

      - name: Save refreshed mirror and heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror
          if git diff --cached --quiet; then
            echo "No mirror changes to commit."
          else
            git commit -m "Automated Slate knowledge mirror refresh"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: mirror

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
